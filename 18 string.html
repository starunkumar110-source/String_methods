<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>

    <body>
        <script>
            let s1 = "example string number 1";
            console.log(s1.length);

            let a20 = "example string number 20 ";
            console.log(a20.includes("number"));

            console.log(b3.toUpperCase());

            let b1 = "example strining number 1";

            console.log(c8.trim());

            let d1 = "     example strining number 3 ";
            console.log(d1.trimStart());

            let e1 = "example strining number 4     ";
            console.log(e1.trimEnd());

            let g3 = "I".concat(" am Tarun");

            console.log(ts6.toString());

            console.log(pe5.padEnd(6, "0"));
